source = ~/.config/hypr/modules/variables.conf

general {
    disable_loading_message = true
    hide_cursor = true
}

background {
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 300, 50
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    placeholder_text =

    outer_color = rgb(444444)
    inner_color = rgb(333333)
    font_color = rgb(ffffff)

    fade_on_empty = false
    check_color = rgb(ff0000)
}
