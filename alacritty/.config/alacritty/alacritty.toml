# Jet Brains 
[font]
size = 14.5
normal = { family = "JetBrains Mono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrains Mono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrains Mono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrains Mono Nerd Font Mono", style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }


[window]
opacity = 0.95
dimensions = { columns = 80, lines = 20 }
startup_mode = "Windowed"

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true
